<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will's Journal</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/png" sizes="64x64" href="/Images/favicon.png">
    <style>
        body {
        --flower-branch: url('Images/Leaves/1.png');
        --flower-pink: url('Images/Leaves/2.png');
        --flower-striped: url('Images/Leaves/3.png');
        --flower-blush: url('Images/Leaves/4.png');
        --flower-rose: url('Images/Leaves/5.png');

        background-image:
            var(--flower-blush), var(--flower-pink),
            var(--flower-branch), var(--flower-striped),
            var(--flower-rose), var(--flower-blush),
            var(--flower-pink), var(--flower-branch),
            var(--flower-striped), var(--flower-rose),
            var(--flower-blush), var(--flower-pink),
            var(--flower-branch), var(--flower-striped),
            var(--flower-rose);

        background-repeat: no-repeat;

        background-size:
            85px auto, 110px auto,
            135px auto, 100px auto,
            75px auto, 125px auto,
            90px auto, 115px auto,
            105px auto, 80px auto,
            100px auto, 95px auto,
            130px auto, 85px auto,
            70px auto;

        background-position:
            left 3% top 35px, right 5% top 75px,
            left -25px top 25%, right -10px top 30%,
            left 12% top 42%, right 10% top 48%,
            left 2% top 60%, right 2% top 68%,
            left 14% top 78%, right 14% top 85%,
            left 3% bottom 20px, right 4% bottom 25px,
            left 30% bottom 5px, right 30% bottom 10px,
            center bottom 4px;
    }
    </style>
</head>

>

>

            <p><a href="/placeholder/">Full Entry</a></p>
        </article>
    </main>
</body>
</html>
